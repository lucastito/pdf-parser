[project]
name = "pdf-parser"
version = "0.1.0"
description = "Parser de documentos agnóstico de domínio, com saída validada contra schema"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.black]
line-length = 95
target-version = ["py310"]

[tool.coverage.run]
source = ["src"]
