[project]
name = "pdf-parser"
version = "0.1.0"
description = "Parser de documentos agnóstico de domínio, com saída validada contra schema"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "pint>=0.24",
    "pandera>=0.20",
    # Usadas por src/parser/extratores/ e roteamento por página, sem estar
    # declaradas até aqui — funcionava por arrasto de outra instalação.
    "pdfplumber>=0.11",
    "camelot-py[cv]>=0.11",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Embaralha a ordem dos testes a cada execução (semente aleatória por
    # padrão, impressa no início da rodada). Existe pra achar dependência
    # oculta de ordem/estado entre testes — o tipo de bug que só aparece às
    # vezes, "na máquina de outra pessoa" (achado de PLANO.md, item −1.2).
    "pytest-randomly>=3.0",
    "black>=24.0",
    "flake8>=7.0",
    # A suíte lê `experimentos/pdf/manifest.yaml` para conferir os documentos.
    # Estava instalado por arrasto de outra dependência: funcionava aqui e
    # quebraria num clone limpo, que é onde ninguém está olhando.
    "pyyaml>=6.0",
]
# Só o Cenário A (experimento multimáquina) usa isto — `procedencia.py` e
# `medicao.py` leem processo e hardware para a trava de execução concorrente
# entre máquinas emprestadas. Cenário B roda num servidor só e não importa
# nenhum dos dois módulos. Extra separado em vez de `dependencies`: instalar
# o mínimo pra produção não deveria puxar uma dependência que produção nunca
# importa.
experimento = [
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "experimento_a: só faz sentido no cenário de pesquisa (A) — trava de execução concorrente entre máquinas de experimento, alocação de modelo por máquina emprestada. Não roda em produção (B), que opera num servidor só. Rodar tudo, exceto isto: `pytest -m \"not experimento_a\"`.",
]

[tool.black]
line-length = 95
target-version = ["py310"]

[tool.coverage.run]
source = ["src"]
